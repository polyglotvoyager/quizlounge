<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Register - Quiz Lounge</title>
    <style type="text/css">
    html {
      height: 100vh;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      margin: 0;
      width: 100%;
      height: 100vh;
      background: papayawhip;
    }

    #form {
      display: flex;
      padding: 0 0.5em 0 0.5em;
      margin: 0;
      max-height: 12rem;
      overflow: hidden;
    }

    #userinput {
      margin-left: 1rem;
      padding: 0.5rem;
    }

    #submitbutton {
      font-size: 1.2rem;
      margin-left: 0.4rem;
    }

    </style>
  </head>
  <body>
    <form id="form" action="/quizlounge/play" method="GET">
      <input type="text" id="userinput" name="username" size="16" placeholder="Enter your username..." autofocus>
      <input type="submit" id="submitbutton" value="Continue" />
    </form>
  </body>
</html>
